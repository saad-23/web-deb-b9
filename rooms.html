<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms Section</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="rooms-section">
            <div class="rooms-header">
                <h2>Rooms</h2>
                <i class="fas fa-info-circle"></i>
            </div>
            <div class="room-list">
                <div class="room-item">
                    <div class="room-icon"><i class="fas fa-bath"></i></div>
                    <div class="room-details">
                        <h3>Bedroom</h3>
                        <p>3 device(-s)</p>
                    </div>
                    <div class="room-arrow"><i class="fas fa-chevron-right"></i></div>
                </div>
                <div class="room-item">
                    <div class="room-icon"><i class="fas fa-utensils"></i></div>
                    <div class="room-details">
                        <h3>Kitchen</h3>
                        <p>2 device(-s)</p>
                    </div>
                    <div class="room-arrow"><i class="fas fa-chevron-right"></i></div>
                </div>
                <div class="room-item active">
                    <div class="room-icon"><i class="fas fa-couch"></i></div>
                    <div class="room-details">
                        <h3>Living room</h3>
                        <p>5 device(-s)</p>
                    </div>
                    <div class="room-arrow"><i class="fas fa-chevron-right"></i></div>
                </div>
                <div class="room-item">
                    <div class="room-icon"><i class="fas fa-bed"></i></div>
                    <div class="room-details">
                        <h3>Bathroom</h3>
                        <p>1 device(-s)</p>
                    </div>
                    <div class="room-arrow"><i class="fas fa-chevron-right"></i></div>
                </div>
            </div>
            <button class="btn add-room-btn">
                <i class="fas fa-plus"></i> ADD ROOM
            </button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
